name: Build My AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web files
        run: |
          rm -rf www android extracted
          mkdir -p www extracted

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*My-ai-app*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted

            INDEX_FILE=$(find extracted -type f -name "index.html" -print -quit)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html was not found inside the ZIP."
              find extracted -maxdepth 4 -type f | head -100
              exit 1
            fi

            WEB_ROOT=$(dirname "$INDEX_FILE")
            echo "Found web files in: $WEB_ROOT"

            cp -a "$WEB_ROOT"/. www/
          elif [ -f "index.html" ]; then
            echo "Found index.html in repository root."
            cp -a . www/
            rm -rf www/.git
            rm -rf www/.github
            rm -rf www/node_modules
            rm -rf www/android
          else
            echo "ERROR: No ZIP file and no index.html found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html was not created."
            exit 1
          fi

          echo "SUCCESS: www/index.html found."
          ls -la www

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rishiraj.myai",
            "appName": "My AI",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync My AI
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
