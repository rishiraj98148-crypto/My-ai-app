name: Build My AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web files
        run: |
          rm -rf www android extracted
          mkdir -p www extracted

          if [ -f "index.html" ]; then
            echo "Found index.html in repository root."
            cp -a . www-temp
            rm -rf www-temp/.git
            rm -rf www-temp/.github
            rm -rf www-temp/node_modules
            rm -rf www-temp/android
            mv www-temp www
          elif [ -f "My-ai-app.zip" ]; then
            echo "Extracting My-ai-app.zip..."
            unzip -q "My-ai-app.zip" -d extracted

            INDEX_FILE=$(find extracted -type f -name "index.html" | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html was not found inside My-ai-app.zip"
              exit 1
            fi

            WEB_ROOT=$(dirname "$INDEX_FILE")
            echo "Found web project at: $WEB_ROOT"

            cp -a "$WEB_ROOT"/. www/
          else
            echo "ERROR: No index.html and no My-ai-app.zip found."
            exit 1
          fi

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html was not created."
            exit 1
          fi

          echo "Web files ready:"
          ls -la www

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rishiraj.myai",
            "appName": "My AI",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync My AI
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
